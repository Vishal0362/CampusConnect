<!DOCTYPE html>
<html>
<head>
<title>Edit Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow w-96">

<h2 class="text-xl font-semibold mb-4">Edit Profile</h2>

<form id="editForm" class="space-y-4">

<input id="name" placeholder="Name" class="w-full p-2 border rounded" required>
<input id="department" placeholder="Department" class="w-full p-2 border rounded" required>
<input id="course" placeholder="Course" class="w-full p-2 border rounded" required>
<input id="semester" placeholder="Semester" class="w-full p-2 border rounded" required>
<input id="year" placeholder="Year" class="w-full p-2 border rounded" required>

<button class="w-full bg-black text-white py-2 rounded">
Update
</button>

</form>

</div>

<script src="edit-profile.js?v=20260424-1"></script>

</body>
</html>
