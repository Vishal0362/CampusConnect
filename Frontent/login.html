<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - CampusConnect</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
  font-family: 'Inter', sans-serif;
}

.password-wrap{
  position:relative;
}

.password-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:transparent;
  color:#4b5563;
  font-size:13px;
  cursor:pointer;
}

.password-input{
  padding-right:60px;
}
</style>

</head>

<body class="min-h-screen flex bg-white">

<!-- LEFT SIDE -->
<div class="hidden md:flex w-1/2 bg-gradient-to-br from-black to-gray-900 text-white flex-col justify-center px-16">

  <div class="max-w-md">

    <!-- LOGO -->
    <div class="mb-10">
      <div class="bg-white/10 w-14 h-14 rounded-2xl flex items-center justify-center text-xl backdrop-blur">
        🎓
      </div>
    </div>

    <!-- TEXT -->
    <h1 class="text-4xl font-bold leading-tight mb-5">
      Welcome to <br>CampusConnect
    </h1>

    <p class="text-gray-400 mb-8 text-sm leading-relaxed">
      Share notes, trade textbooks, chat with classmates — all in one place.
    </p>

    <!-- USERS -->
    <div class="flex items-center gap-3 text-sm text-gray-400">
      <div class="flex -space-x-2">
        <div class="w-9 h-9 bg-gray-700 rounded-full flex items-center justify-center text-xs border border-gray-800">A</div>
        <div class="w-9 h-9 bg-gray-600 rounded-full flex items-center justify-center text-xs border border-gray-800">S</div>
        <div class="w-9 h-9 bg-gray-500 rounded-full flex items-center justify-center text-xs border border-gray-800">R</div>
        <div class="w-9 h-9 bg-gray-400 rounded-full flex items-center justify-center text-xs border border-gray-800">P</div>
      </div>
      <span>100+ students already joined</span>
    </div>

  </div>

</div>

<!-- RIGHT SIDE -->
<div class="w-full md:w-1/2 flex items-center justify-center bg-gray-50">

  <div class="w-full max-w-md p-8">

    <!-- CARD -->
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100">

      <h2 class="text-2xl font-semibold text-gray-900 mb-2">
        Welcome back
      </h2>

      <p class="text-sm text-gray-500 mb-6">
        Sign in to your account to continue
      </p>

      <form id="loginForm" class="space-y-5">

        <!-- EMAIL -->
        <div>
          <label class="text-sm text-gray-600">Email</label>
          <input 
            type="email"
            id="email"
            placeholder="you@university.edu"
            required
            class="w-full mt-1 p-3 rounded-xl border border-gray-200 focus:border-black focus:ring-1 focus:ring-black outline-none transition"
          >
        </div>

        <!-- PASSWORD -->
        <div>
          <div class="flex justify-between text-sm">
            <label class="text-gray-600">Password</label>
            <span class="text-gray-400 cursor-pointer hover:underline">
              Forgot password?
            </span>
          </div>

          <div class="password-wrap mt-1">
            <input 
              type="password"
              id="password"
              required
              class="password-input w-full p-3 rounded-xl border border-gray-200 focus:border-black focus:ring-1 focus:ring-black outline-none transition"
            >
            <button type="button" class="password-toggle" data-toggle-password="password">Show</button>
          </div>
        </div>

        <!-- ERROR -->
        <div id="loginError" 
          class="hidden bg-red-100 text-red-600 px-4 py-2 rounded-lg text-sm">
        </div>

        <!-- BUTTON -->
        <button 
          type="submit"
          class="w-full bg-black text-white py-3 rounded-xl hover:scale-[1.02] active:scale-[0.98] transition flex items-center justify-center gap-2 font-medium">
          Sign in →
        </button>

      </form>

      <!-- REGISTER -->
      <p class="text-sm text-gray-500 mt-6 text-center">
        Don't have an account?
        <a href="register.html" class="text-black font-medium hover:underline">
          Create one
        </a>
      </p>

    </div>

  </div>

</div>

<script src="script.js?v=20260424-1"></script>

</body>
</html>
